[workspace]
members = [
    "crates/blablablars-core",
    "crates/blablablars-cli",
    "crates/blablablars-python",
]
# Everything except the bindings: `cargo test` must not try to link a Python
# extension module against libpython.
default-members = ["crates/blablablars-core", "crates/blablablars-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/oozut/blablablars"
authors = ["Guillaume <oozut@users.noreply.github.com>"]

[workspace.dependencies]
blablablars-core = { path = "crates/blablablars-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.30", default-features = false, features = ["macros", "abi3-py310"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
