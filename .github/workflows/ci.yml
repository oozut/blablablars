name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The CLI embeds CPython by default, so the runner needs the headers and
      # libpython at link time.
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude blablablars-python --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude blablablars-python

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: Install maturin
        run: pip install "maturin>=1.16,<2"
      - name: Build and install the extension
        working-directory: python
        run: maturin develop --release
      - name: Build the example Rust extension
        run: cargo build --manifest-path examples/rust-plugin/Cargo.toml --target-dir target/plugin-fixture
      - name: Tests
        working-directory: python
        run: python -m unittest discover -s tests -v
      - name: End-to-end with the Rust binary
        run: |
          cargo build --release -p blablablars-cli
          echo "--- child process"
          target/release/blablablars run "hello brave world" --json \
            --plugin "python -m blablablars.runtime examples/python/hello_plugin.py"
          echo "--- in process (Rust cdylib + embedded Python)"
          target/release/blablablars run "hello brave world" --json \
            --plugin rust:target/plugin-fixture/debug/libblablablars_example_rust_plugin.so \
            --python-path python \
            --plugin python:examples/python/hello_plugin.py
      - name: The plugin list is the long-term attachment path
        run: |
          config="$RUNNER_TEMP/blablablars-plugins"
          target/release/blablablars plugin add \
            rust:target/plugin-fixture/debug/libblablablars_example_rust_plugin.so \
            --config "$config"
          target/release/blablablars plugin list --config "$config"
          target/release/blablablars run "hello brave world" --json --plugin-config "$config"
      - name: CLI tests against the built package
        run: cargo test -p blablablars-cli
